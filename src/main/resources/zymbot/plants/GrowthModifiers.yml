# Let's Do Vinery's dark cherry tree, added 2026-10-08. Gated to the three biomes Vinery itself grows
# it in - its own `vinery:spawns_cherry_tree` biome tag lists plains, sunflower plains and meadow, and
# nothing else - so a planted orchard follows the same map as a wild tree, as the grapes do. Vinery
# lets the sapling grow anywhere, and with no entry here this file never asked it anything.
#
# A tree's figures rather than a bush's: the 8% and 1% every vanilla sapling above carries. Anywhere
# else it dies at its next growth attempt, which is also how CHERRY_SAPLING outside a cherry grove
# behaves. Not a group: Temperate holds these three but also forests, the cherry grove and oceans,
# far looser than where the tree actually grows.
vinery:dark_cherry_sapling:
  BiomeGroup:
    Groups: []
  Default:
    GrowthRate: 8
    NaturalDeathChance: 1
    Biome:
    - PLAINS
    - SUNFLOWER_PLAINS
    - MEADOW

# Vinery's apple tree, the same three biomes and the same figures as the dark cherry above - the
