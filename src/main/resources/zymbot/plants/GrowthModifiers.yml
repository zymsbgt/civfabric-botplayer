# The cold crop. Temperate is dropped: only this config ever claimed it, and Temperate is the most
# crowded group in the file. Chilly has two sources behind it and Frozen two; Frozen is raised to 75%
# because only three plants grow there at all, and beetroot being the reliable one gives snowy plains
# and frozen peaks something to export. CHERRY_GROVE is listed by hand, from Joyfuul's.
BEETROOTS:
  BiomeGroup:
    Groups:
    - Chilly
    - Frozen
    Chilly:
      GrowthRate: 100
      NaturalDeathChance: 1.7
    Frozen:
      GrowthRate: 75
      NaturalDeathChance: 3.45
  Default:
    GrowthRate: 75
    NaturalDeathChance: 3.45
    Biome:
    - CHERRY_GROVE


CARROTS:
  BiomeGroup:
    Groups:
    - Chilly
    Chilly:
      GrowthRate: 50
      NaturalDeathChance: 2.29
  Default:
    GrowthRate: 100
    NaturalDeathChance: 0.73
    Biome:
    - BIRCH_FOREST
    - DARK_FOREST
    - FLOWER_FOREST
    - FOREST
    - OLD_GROWTH_BIRCH_FOREST

# A forest crop, not a plains one, changed 2026-09-09. Jungle is still where a melon does best - that
# is where vanilla grows them wild - but its second home is now the five forests by name rather than
# the whole Temperate group.
#
# Temperate was the wrong shape for it. That group holds plains, sunflower plains, meadow, cherry
# grove, mushroom fields and every ocean as well as the forests, which is most of the settled island:
# melon was a crop you grew wherever you already lived, at a rate poor enough that nobody bothered.
# Naming the forests makes it a crop worth walking to, and on Broneo Island there is more forest than
# plains inside the border - 399 chunks against 202 - so this is a move sideways rather than a squeeze.
#
# The rate goes up from 25% because the range came down. A quarter rate across the whole temperate
# world is a crop nobody plants; sixty percent in the forests is one somebody chooses.
MELON_STEM:
  BiomeGroup:
    Groups:
    - Tropical
    Tropical:
      GrowthRate: 100
      NaturalDeathChance: 0.73
  Default:
    GrowthRate: 60
    NaturalDeathChance: 1.5
    Biome:
    - FOREST
    - BIRCH_FOREST
    - OLD_GROWTH_BIRCH_FOREST
    - DARK_FOREST
    - FLOWER_FOREST

PITCHER_CROP:
  BiomeGroup:
    Groups:
    - Tropical
    - Savanna
    Tropical:
      GrowthRate: 100
      NaturalDeathChance: 1.27
    Savanna:
      GrowthRate: 100
      NaturalDeathChance: 1.27
  Default:
    Biome:
      # No growth in other biomes
      []

# Rocky ground, not forests. The shipped config gave POTATOES the CARROTS entry verbatim - same
# five forest biomes, same four numbers - where both the BiomeDependentResources datapack and
# Joyfuul's Rise of Civs independently put potatoes on windswept and stony terrain.
# STONY_PEAKS, JAGGED_PEAKS and STONY_SHORE are listed explicitly rather than by group: the first
# belongs to no group at all, and the other two sit inside Frozen and Chilly, which would have
# dragged every snowy and taiga biome along with them.
POTATOES:
  BiomeGroup:
    Groups:
    - Windy
    - Arid
    Windy:
      GrowthRate: 100
      NaturalDeathChance: 0.73
    Arid:
      GrowthRate: 100
      NaturalDeathChance: 0.73
  Default:
    GrowthRate: 100
    NaturalDeathChance: 0.73
    Biome:
    - STONY_PEAKS
    - JAGGED_PEAKS
    - STONY_SHORE


