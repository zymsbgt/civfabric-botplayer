# Let's Do Vinery's grape bushes, added 2026-09-08 after a playtest found them growing anywhere at full
# speed - they were the one crop family in the pack this file had never heard of, so nothing was asked
# of them at all.
#
# Vinery names its four families after biomes and then lets all four grow everywhere, which throws the
# distinction away. Keying each to the climate it is named for gives the names their meaning back: a
# taiga grape is the one that grows in a taiga, and a vintner who wants all four has to travel for
# them. That is a trade route rather than a chore, and it is the reason to key these at all.
#
# Death chances are a berry bush's rather than a tilled crop's. A bush is a perennial that is picked
# and left standing, so a death costs the whole plant and every harvest still to come, not one season.
# The Default rate is deliberately survivable rather than zero - a grape out of its climate should be a
# poor idea, not an impossible one.

vinery:red_grape_bush:
  BiomeGroup:
    Groups:
    - Temperate
    Temperate:
      GrowthRate: 100
      NaturalDeathChance: 0.67
  Default:
    GrowthRate: 20
