    Chilly:
      GrowthRate: 75
      NaturalDeathChance: 2.6
  Default:
    Biome:
      []

# The deliberate exception. Everything else has been pushed inland; rice is the one crop that belongs
# on the water, and it is not really a choice - rice's own placement rule demands shallow water, so a
# biome gate here is an intersection rather than a list. Full rate on RiverAndCoasts rather than sugar
# cane's 40%, because this is what a waterside town exports. Wetlands and rivers, and nothing else.
farmersdelight:rice:
  BiomeGroup:
    Groups:
    - Tropical
    - RiverAndCoasts
    Tropical:
      GrowthRate: 100
      NaturalDeathChance: 1.7
    RiverAndCoasts:
      GrowthRate: 100
      NaturalDeathChance: 1.7
  Default:
    Biome:
      []

# Follows the author: wild oat spawns in meadow and the taigas. A cold-climate cereal, and the one
# grain that prefers the north.
