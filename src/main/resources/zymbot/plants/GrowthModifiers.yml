########################################################################################################################
#| Modded crops                                                                                                       |#
########################################################################################################################
#
# Death chances below are PER GROWTH EVENT, and deliberately not the 5/10 the vanilla entries use.
# Only the nine materials in the plugin's `agriculturalPlants` set have their figure divided by the
# plant's maximum age; every modded crop takes the full number on every stage. Writing 5 here would
# have meant a 30% loss on a seven-stage crop rather than the 5% it reads as. Each value is solved
# from the crop's own stage count so the intent - about 5% across a plant's life, 10% in a poor
# biome - is what actually happens.
#
# Modded plants are named by registry id. Unqualified uppercase names above are read as minecraft:
# lowercased, so both forms coexist. The plugin cannot express this at all - it is Material-based,
# and a modded block is not a Material - so gating modded crops is something only the port can do.

# Cabbage moved inland. Farmer's Delight spawns wild cabbages on beaches, which is where the coast
# already had the advantage; cabbage is a cool-weather brassica and belongs in the taigas. The wild
# spawn tag is narrowed to match in the datapack, so seeds are found where they can be grown.
farmersdelight:cabbages:
  BiomeGroup:
    Groups:
    - Chilly
    - Temperate
    Chilly:
      GrowthRate: 100
      NaturalDeathChance: 0.73
    Temperate:
      GrowthRate: 75
      NaturalDeathChance: 1.49
  Default:
    Biome:
      []

# Both mods' tomatoes, deliberately identical. Farmer's Delight scatters wild tomatoes in hot biomes
# and Farm & Charm in plains, savanna and badlands; the overlap is savanna and badlands, which is
# what these entries keep. Jungle at 75% honours the Farmer's Delight lean without making it a
# jungle crop. Convergence matters because #c:crops/tomato merges across both mods - a recipe using
# the tag takes either - so a player who cannot tell the two apart in a chest should not be able to
# tell them apart by where they grow either.
farmersdelight:tomatoes:
  BiomeGroup:
    Groups:
    - Savanna
    - Arid
    - Tropical
    - Temperate
    Savanna:
      GrowthRate: 100
      NaturalDeathChance: 1.7
    Arid:
      GrowthRate: 100
      NaturalDeathChance: 1.7
    Tropical:
      GrowthRate: 75
      NaturalDeathChance: 3.45
    Temperate:
      GrowthRate: 60
      NaturalDeathChance: 3.45
  Default:
    Biome:
      []

# The other half of the pair above.
farm_and_charm:tomato_crop:
  BiomeGroup:
    Groups:
    - Savanna
    - Arid
    - Tropical
    - Temperate
    Savanna:
      GrowthRate: 100
      NaturalDeathChance: 1.27
    Arid:
      GrowthRate: 100
      NaturalDeathChance: 1.27
    Tropical:
      GrowthRate: 75
      NaturalDeathChance: 2.6
    Temperate:
      GrowthRate: 60
      NaturalDeathChance: 2.6
  Default:
    Biome:
      []

# Both mods' onions, deliberately identical. Neither author has a real opinion: Farmer's Delight
# spawns wild onions at #minecraft:is_overworld and Farm & Charm folds them into a shared
# spawns_wild_crops tag. Temperate and Chilly is the ordinary reading of an onion, and it keeps them
# off rivers.
farmersdelight:onions:
  BiomeGroup:
    Groups:
    - Temperate
    - Chilly
    Temperate:
      GrowthRate: 100
