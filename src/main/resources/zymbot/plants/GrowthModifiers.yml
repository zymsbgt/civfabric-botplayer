# Meadow keeps the 100% it has in both this config and the BiomeDependentResources datapack.
# Tropical at 50% is Joyfuul's swamp, at the same reduced rate Savanna already carries - swamp
# had no grain at all, and waterlogged ground growing poor wheat explains itself. Note Tropical
# also brings the jungles, which is a wider reading of that source than it gave.
# Wheat never fails in the ground it belongs to. Plains, sunflower plains and meadow are the crop's
# home and carry no death chance at all; savanna is 95% across seven stages. The jungles and swamps of
# Tropical are left at 90%, so the wetter ground is now the worse bet of wheat's two marginal groups -
# which is the only thing separating them.
WHEAT:
  BiomeGroup:
    Groups:
    - Savanna
    - Swamp
    Savanna:
      GrowthRate: 50
      NaturalDeathChance: 0.73
    # Swamps only: wheat no longer grows in a jungle (the owner's call, 2026-10-11). Same rates the
    # Tropical group gave it.
    Swamp:
      GrowthRate: 50
      NaturalDeathChance: 1.49
  Default:
    GrowthRate: 100
    NaturalDeathChance: 0.0
    Biome:
    - PLAINS
    - SUNFLOWER_PLAINS
    - MEADOW


