# Realistic Plant Growth Modifiers File
#
# For additional configuration details and examples, visit the Realistic Plant Growth documentation at:
# https://realistic-plant-growth.nightevolution.de/
#
# A complete list of biomes can be found in the Spigot API documentation:
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/block/Biome.html
#
# Information on plants and crops can be referenced in the "Material" list at:
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
#
# If you appreciate this plugin, please consider showing your support with a donation.
# Your contributions help maintain and develop the plugin further. Thank you! ❤️
#
# Donation link: https://www.buymeacoffee.com/TheRealPredator
#
########################################################################################################################
#
# This configuration file adjusts the growth rate behavior of specified plants (Bukkit Materials)
# in relation to the vanilla game. A 'GrowthRate' of 100% mirrors vanilla behavior.
# Growth rates above 100% must be enabled in 'Config.yml' first. Higher rates introduce the
# possibility of plants skipping growth states or aging faster. Plants not specified in this
# file adhere to the vanilla GrowthRate.
#
# Note:
# Every biome not listed under 'Groups' or in the 'Biome' list is considered a 'BAD' biome where the plant dies with
# a 100% chance. Fertilizer in range can enable plant growth in 'BAD' biomes.
# BiomeGroups listed under 'Groups' and not specified further receive the 'Default' values.
#
# Disclaimer:
# The GrowthModifiers.yml settings provided here are EXAMPLES. Users are encouraged to customize and modify
# these settings based on their specific preferences and gameplay needs.
# Experiment with different growth rates in various biomes to create a unique and tailored
# experience in your Minecraft world.
#
# I would greatly appreciate sharing well-configured versions of this file with the community :)
#
########################################################################################################################
# Copied elsewhere: CivFabric's village/BiomeProduce restates which crops grow at 100% in each villager
# type's home biome, to decide what Farmer villagers sell and buy. Moving a crop's biome here does not
# move it there - change both.
#
# Bamboo grows only in biomes within the 'Tropical' biome group.
# Since 'Biome' is an empty list, every other biome is considered as 'BAD'.
# Death chances for the seven plants the plugin normalises - wheat, carrots, potatoes, beetroots,
# nether wart and the two stems - are stated PER GROWTH EVENT here, converted from the figures it
# ships. Upstream divides those by the plant's maximum age, but only for nine hardcoded materials, so
# a `5` on wheat meant about 5% across its whole life while the same `5` on cocoa meant 5% every
# stage. This port applies one rule to everything, so each number is solved from that plant's own
# stage count and means the same thing everywhere in this file.
BAMBOO:
  BiomeGroup:
    Groups:
    - Tropical
    Tropical:
      GrowthRate: 100
      NaturalDeathChance: 5
  Default:
    Biome:
      # No growth in other biomes
      []


# Cactus growth is limited to arid Biomes
CACTUS:
  BiomeGroup:
    Groups:
    - Arid
    Arid:
      GrowthRate: 100
      NaturalDeathChance: 0.34
  Default:
    Biome:
      # No growth in other biomes
      []


# Not fully supported yet
CHORUS_FLOWER:
  BiomeGroup:
    Groups:
    - End
    - Frozen
    End:
      GrowthRate: 100
      NaturalDeathChance: 1.02
    Frozen:
      GrowthRate: 50
      NaturalDeathChance: 4.36
  Default:
    Biome:
      # No growth in other biomes
      []


# Cocoa growth is limited to jungle biomes
COCOA:
  BiomeGroup:
    Groups: []
  Default:
    GrowthRate: 100
    NaturalDeathChance: 2.53
    Biome:
    - JUNGLE
    - BAMBOO_JUNGLE
    - SPARSE_JUNGLE


NETHER_WART:
  BiomeGroup:
    Groups:
    - Nether
    - Arid
    - Savanna
    Nether:
      GrowthRate: 100
      NaturalDeathChance: 1.7
    Arid:
      GrowthRate: 60
      NaturalDeathChance: 3.45
    Savanna:
      GrowthRate: 20
      NaturalDeathChance: 3.45
  Default:
    Biome:
      # No growth in other biomes
      []


# Hot climates at full rate, temperate rivers and beaches at a penalty.
# Cane already needs adjacent water whatever the biome, so a gate here is an intersection rather
# than a list - jungle-only, as shipped, is far narrower than it reads. The 40% on RiverAndCoasts
# exists because paper is the Librarian's spine: cartography table, ender chest and enchanting
# table all gate on that class, and a hard chokepoint on cane would be a hard chokepoint on all
# three. A riverside town can still make paper, slowly; a jungle or desert town has something
# worth trading.
#
# Death chances are 0 and 5 rather than the file's usual 5 and 10, and that is not leniency.
# NaturalDeathChance is divided by the plant's maximum age only for the nine materials in the
# plugin's `agriculturalPlants` set - wheat, carrots, potatoes, beetroots, nether wart and the two
# stems. Cane is not among them, so it takes the full figure on every growth event with no
# normalisation, about seven times the per-event risk a crop carries. A cane stalk fires one event
# per block, so the shipped 5% meant roughly a one-in-ten chance of dying on the way up, in its
# best biome. Zero in the biomes it belongs in; the 5% on rivers is the real penalty.
SUGAR_CANE:
  BiomeGroup:
    Groups:
    - Tropical
    - Arid
    - RiverAndCoasts
    Tropical:
      GrowthRate: 100
      NaturalDeathChance: 0.0
    Arid:
      GrowthRate: 100
      NaturalDeathChance: 0.0
    RiverAndCoasts:
      GrowthRate: 40
      NaturalDeathChance: 0.34
  Default:
    Biome:
      []


# A perennial, priced as one. The bush has three stages and regrows to age 1 after every harvest, so
# its death chance is rolled twice per cycle for as long as the plant stands - and it is un-normalised,
# so the shipped 35% meant a 42% chance of surviving each harvest. Frozen berry patches were not a
# crop, they were a consumable, in one of only three biomes where anything grows at all.
#
# 2% in the biomes it belongs to and 5% where it is struggling: about 96% and 90% survival per cycle,
# so a patch thins slowly and rewards tending rather than punishing the act of picking it.
SWEET_BERRY_BUSH:
  BiomeGroup:
    Groups:
    - Chilly
    - Frozen
    - Temperate
    Chilly:
      GrowthRate: 100
      NaturalDeathChance: 0.67
    Frozen:
      GrowthRate: 80
      NaturalDeathChance: 0.67
    Temperate:
      GrowthRate: 60
      NaturalDeathChance: 1.7
  Default:
    GrowthRate: 25
    NaturalDeathChance: 1.7
    Biome:
    - WINDSWEPT_FOREST
    - WINDSWEPT_GRAVELLY_HILLS
    - WINDSWEPT_HILLS


